# Inventory: who Ansible manages and how it groups them.
# 'legacy' = hosts that run the legacy RoboShop stack; 'dev' = the environment they belong to.
all:
  children:
    legacy:
      hosts:
        workstation:
          ansible_host: localhost
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    dev:
      hosts:
        workstation: {}
