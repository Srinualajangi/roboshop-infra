---
- name: "{{ svc.name }} | build dir"
  ansible.builtin.file:
    path: "{{ roboshop_build_dir }}/{{ svc.name }}"
    state: directory
    mode: "0755"
  become: false

- name: "{{ svc.name }} | main.go"
  ansible.builtin.copy:
    src: "{{ roboshop_app_src }}/{{ svc.name }}/main.go"
    dest: "{{ roboshop_build_dir }}/{{ svc.name }}/main.go"
    remote_src: true
    mode: "0644"
  become: false
  register: go_main

- name: "{{ svc.name }} | go.mod / go.sum (pinned dependency versions)"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ roboshop_build_dir }}/{{ svc.name }}/{{ item }}"
    mode: "0644"
  loop: [go.mod, go.sum]
  become: false
  register: go_mod

- name: "{{ svc.name }} | binary present?"
  ansible.builtin.stat:
    path: "{{ roboshop_build_dir }}/{{ svc.name }}/{{ svc.name }}"
  register: go_bin

- name: "{{ svc.name }} | go build"
  ansible.builtin.command: go build -o {{ svc.name }} .
  args:
    chdir: "{{ roboshop_build_dir }}/{{ svc.name }}"
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: auto
  become: false
  when: go_main.changed or go_mod.changed or not go_bin.stat.exists
  changed_when: true

- name: "{{ svc.name }} | install binary"
  ansible.builtin.copy:
    src: "{{ roboshop_build_dir }}/{{ svc.name }}/{{ svc.name }}"
    dest: "{{ app_dir }}/{{ svc.name }}"
    remote_src: true
    owner: "{{ roboshop_user }}"
    group: "{{ roboshop_user }}"
    mode: "0755"
  register: go_art

- name: "{{ svc.name }} | remember whether the app changed"
  ansible.builtin.set_fact:
    app_changed: "{{ go_art.changed }}"
