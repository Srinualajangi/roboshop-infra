# kind cluster for the RoboShop lab. Recreated from scratch at every boot by steps/kind.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: roboshop
nodes:
  - role: control-plane
    # host:80 -> Traefik NodePort 30080, host:443 -> 30443 (used from Day 40)
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker            # roboshop-worker
    labels:
      pool: general
  - role: worker            # roboshop-worker2
    labels:
      pool: general
  - role: worker            # roboshop-worker3 = the "prod node pool"
    labels:
      pool: prod
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: dedicated
              value: prod
              effect: NoSchedule
