# .github/workflows/lab.yml — one-click workstation up/down + nightly safety-net destroy.
name: lab

on:
  workflow_dispatch:
    inputs:
      action:
        description: up = create today's workstation, down = destroy it
        type: choice
        options: [up, down]
        default: up
  schedule:
    - cron: "0 22 * * *"         # 22:00 UTC daily (03:30 IST): destroy whatever is left

# never run 'up' and 'down' at the same time against the same state
concurrency:
  group: lab
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.0.0"            # ← same as versions.env
  AWS_REGION: us-east-1

jobs:
  lab:
    runs-on: ubuntu-24.04
    environment: lab
    timeout-minutes: 20
    env:
      ACTION: ${{ github.event_name == 'schedule' && 'down' || inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 1800
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Lab SSH public key (also needed for destroy — the config reads it)
        env:
          KEY: ${{ vars.LAB_SSH_PUBLIC_KEY }}
        run: echo "$KEY" > "$RUNNER_TEMP/lab.pub"
      - name: terraform ${{ env.ACTION }}
        env:
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/lab.pub
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          cd terraform/20-workstation
          terraform init -input=false -backend-config="bucket=roboshop-tfstate-$ACCOUNT"
          if [ "$ACTION" = "up" ]; then
            terraform apply -input=false -auto-approve -lock-timeout=120s
          else
            terraform destroy -input=false -auto-approve -lock-timeout=120s
          fi
      - name: Summary
        run: |
          cd terraform/20-workstation
          if [ "$ACTION" = "up" ]; then
            IID=$(terraform output -raw instance_id)
            {
              echo "### 🟢 Workstation starting: \`$IID\`"
              echo "On the laptop, ~10 min later:"
              echo '`make init LAYER=20-workstation && make ssh-config && make wait`'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            left=$(aws ec2 describe-instances --filters Name=tag:Project,Values=roboshop Name=instance-state-name,Values=pending,running \
                     --query 'length(Reservations[].Instances[])' --output text)
            echo "### 🔴 Destroyed. Running roboshop instances now: $left" >> "$GITHUB_STEP_SUMMARY"
          fi
