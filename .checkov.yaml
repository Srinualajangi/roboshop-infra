# .checkov.yaml — every skip has a reason. Re-review each quarter.
framework:
  - terraform
compact: true
quiet: true            # print failures only
skip-check:
  - CKV_AWS_144        # S3 cross-region replication: lab state bucket, single region by design (cost)
  - CKV_AWS_18         # S3 access logging on the state bucket: CloudTrail data events are the enterprise answer; lab cost
  - CKV2_AWS_62        # S3 event notifications: not needed for a state bucket
  - CKV_AWS_145        # S3 SSE-KMS CMK: SSE-S3 is used to avoid $1/month per key in a lab
  - CKV_AWS_136        # ECR KMS CMK: AES256 is acceptable for public demo images
  - CKV_AWS_126        # EC2 detailed monitoring: workstation lives < 3 h/day
  - CKV_AWS_135        # EBS-optimised: default on current instance families
  - CKV_AWS_341        # IMDS hop limit > 1: deliberately 3 so pods in kind can use the instance role (lab-only, see SPEC)
